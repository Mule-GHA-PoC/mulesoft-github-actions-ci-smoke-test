name: Mule pipeline

# Pull request:         unit tests, package
# Merge to develop:     unit tests, package, publish the SNAPSHOT to Exchange, deploy to Sandbox
# Merge to main:        unit tests, release (maven release:prepare + perform: publishes X.Y.Z to Exchange,
#                       tags it, pushes the next SNAPSHOT version, merges main back into develop)
# Manual (Run workflow): deploy a published version to qa / uat / prod

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Mule application artifactId
        required: true
      version:
        description: Published Exchange version to deploy (for example 1.0.0)
        required: true
      environment:
        description: Target environment
        type: choice
        options: [Sandbox, qa, uat, prod]
        default: Sandbox

permissions:
  contents: read

concurrency:
  group: mule-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    permissions:
      contents: write   # the Release stage pushes the release commit, tag and next version
    uses: Mule-GHA-PoC/mulesoft-github-actions/.github/workflows/mule-pipeline.yml@main
    with:
      artifact_id: ${{ inputs.artifact_id }}
      version: ${{ inputs.version }}
      environment: ${{ inputs.environment }}
    secrets: inherit
